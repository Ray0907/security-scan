name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run planner tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts

      - name: Validate Agent Skill
        run: |
          python3 -m pip install --disable-pip-version-check skills-ref==0.1.1
          agentskills validate "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.8.0

      - name: Lint Markdown
        run: pnpm dlx markdownlint-cli2@0.23.2 "**/*.md"
